<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background hitam -->
  <rect width="64" height="64" fill="#050505"/>
  <!-- Lingkaran bumi -->
  <circle cx="32" cy="32" r="26" stroke="#f4f4f5" stroke-width="2.5"/>
  <!-- Garis meridian vertikal -->
  <ellipse cx="32" cy="32" rx="11" ry="26" stroke="#f4f4f5" stroke-width="2"/>
  <!-- Garis ekuator -->
  <line x1="6" y1="32" x2="58" y2="32" stroke="#f4f4f5" stroke-width="2"/>
  <!-- Garis lintang atas -->
  <ellipse cx="32" cy="20" rx="20" ry="4" stroke="#f4f4f5" stroke-width="1.5"/>
  <!-- Garis lintang bawah -->
  <ellipse cx="32" cy="44" rx="20" ry="4" stroke="#f4f4f5" stroke-width="1.5"/>
</svg>
